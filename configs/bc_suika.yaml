seed: 42
data:
  # 只读复用已有 NPZ，不复制数据、不导入 CQL 代码；服务器可改为自己的相对数据目录。
  directory: data/replay_shards_resources_v4_mirror
  split_file: data/replay_shards_resources_v4_mirror/train_val_split.json
  train_fraction: 0.8
  cache_gb: 4.0
  vertical_positive_is_down: true
model:
  # 固定为宽状态分支 + 独立 32 帧 TCN；旧 GRU checkpoint 不兼容。
  temporal_mode: tcn
  current_hidden_dim: 1024
  object_hidden_dim: 64
  object_set_dim: 128
  temporal_hidden_dim: 256
  temporal_output_dim: 256
  fusion_dim: 1024
  object_embedding_mode: separate
  skill_embedding_dim: 8
  skill_level_embedding_dim: 4
  previous_action_embedding_dim: 32
  card_vocab_size: 512
  card_embedding_dim: 16
training:
  device: auto
  total_steps: 100000
  batch_size: 32
  sequence_length: 32
  burn_in: 31
  replays_per_batch: 4
  learning_rate: 0.0001
  # 标准 BC 对每个有效帧的真实完整动作做交叉熵；0 不做标签平滑。
  label_smoothing: 0.0
  max_grad_norm: 10.0
  weight_decay: 0.0001
  log_interval: 20
  save_interval: 1000
  validation_interval: 1000
  validation_batches: 20
  cpu_threads: 4
  amp: true
  prefetch_batches: 2
  frozen_modules: []
output:
  directory: outputs/bc_suika_wide_tcn32_v2
web:
  # 无 token；SSH 转发访问 localhost:8796，可信局域网可显式改 0.0.0.0。
  host: 127.0.0.1
  port: 8796
  port_attempts: 30
