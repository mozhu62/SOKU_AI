seed: 42
data:
  # 两个对照配置必须使用同一目录和现有划分；服务器上可同时改为自己的相对路径。
  directory: ../soku_cql/data/replay_shards_resources_v4_mirror
  split_file: ../soku_cql/data/replay_shards_resources_v4_mirror/train_val_split.json
  train_fraction: 0.8
  cache_gb: 4.0
  vertical_positive_is_down: true
model:
  temporal_mode: tcn
  current_hidden_dim: 256
  object_hidden_dim: 64
  object_set_dim: 128
  fusion_dim: 256
  gru_hidden_dim: 128
  head_hidden_dim: 128
  object_embedding_mode: separate
  skill_embedding_dim: 8
  skill_level_embedding_dim: 4
  previous_action_embedding_dim: 32
  card_vocab_size: 512
  card_embedding_dim: 16
training:
  device: auto
  total_steps: 100000
  batch_size: 32
  sequence_length: 32
  # TCN 的 31 帧上下文不是 GRU no_grad 预热；每个监督帧的感受野严格为 32 帧。
  burn_in: 31
  replays_per_batch: 4
  learning_rate: 0.0001
  label_smoothing: 0.0
  max_grad_norm: 10.0
  weight_decay: 0.0001
  log_interval: 20
  save_interval: 1000
  validation_interval: 1000
  validation_batches: 20
  cpu_threads: 4
  amp: true
  prefetch_batches: 2
  # GRU 在 TCN 模式中自动冻结且旁路，无须在此重复列出。
  frozen_modules: []
output:
  directory: outputs/temporal_experiments/tcn32_seed42
web:
  host: 127.0.0.1
  port: 8796
  port_attempts: 30
