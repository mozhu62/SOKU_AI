[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soku-ai"
version = "0.1.0"
description = "TH123 Suika DQfD 训练与推理工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "PyYAML>=6.0",
    "torch>=2.1",
    "tensorboard>=2.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["soku_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

