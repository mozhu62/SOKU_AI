[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soku-cql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6", "torch>=2.3",
                "fastapi>=0.115", "uvicorn[standard]>=0.30", "filelock>=3.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soku_cql*"]
